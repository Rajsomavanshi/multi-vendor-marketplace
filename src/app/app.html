<div class="admin-shell">
  <!-- Top Navigation Bar -->
  <header class="app-nav">
    <div class="nav-brand">
      <span class="brand-icon">🏪</span>
      <div class="brand-info">
        <span class="brand-title">Marketplace Admin</span>
        <span class="brand-badge">PRO</span>
      </div>
    </div>

    <!-- Tab Switcher -->
    <nav class="nav-tabs">
      <button
        type="button"
        class="nav-tab-btn"
        [class.active]="activeTab() === 'reports'"
        (click)="setTab('reports')"
      >
        <span class="tab-icon">📊</span>
        <span>Reports & Analytics</span>
      </button>

      <button
        type="button"
        class="nav-tab-btn"
        [class.active]="activeTab() === 'users'"
        (click)="setTab('users')"
      >
        <span class="tab-icon">👥</span>
        <span>User Management</span>
      </button>
    </nav>

    <!-- Admin Profile Pill -->
    <div class="nav-profile">
      <span class="status-indicator"></span>
      <span class="profile-name">Admin Portal</span>
    </div>
  </header>

  <!-- Component View -->
  <main class="app-content">
    <app-reports *ngIf="activeTab() === 'reports'"></app-reports>
    <app-user-management *ngIf="activeTab() === 'users'"></app-user-management>
  </main>
</div>
